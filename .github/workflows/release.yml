name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    name: Package Windows Installer & Portable
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Desktop Toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up JDK 21 (Gradle Daemon & engine-probe)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build setup installer & portable distributable
        run: .\gradlew.bat :desktop:packageSetupInstaller --no-daemon

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $setupExe = Get-ChildItem -Path "desktop\build\compose\binaries\main\installer" -Filter "VComic-*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) {
            throw "未找到 VComic-*-setup.exe 安装包"
          }
          Copy-Item $setupExe.FullName -Destination "release-assets\"

          $version = ($setupExe.BaseName -replace '^VComic-', '' -replace '-setup$', '')
          $portableSrc = "desktop\build\compose\binaries\main\app\venera-desktop"
          if (-not (Test-Path $portableSrc)) {
            throw "未找到便携目录：$portableSrc"
          }
          $portableZip = "release-assets\VComic-$version-portable-win-x64.zip"
          & 7z a -tzip -mx=7 $portableZip "$portableSrc\*"
          if ($LASTEXITCODE -ne 0) {
            throw "打包便携版 zip 失败"
          }

          Get-ChildItem release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VComic-Windows-Release
          path: release-assets/*
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
