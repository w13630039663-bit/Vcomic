<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>收藏页多选态 · 2026-11-18</title>
<style>
/* ── 设计令牌：沿用 favorites-rework-v3 收藏页视觉，不另起系统 ── */
:root{
  --page:#F6F7F9; --card:#FFFFFF; --pill:#E9EDF2;
  --ink1:#1A1D21; --ink2:#5C6670; --ink3:#9AA3AD;
  --accent:#2563EB; --accent-tint:rgba(37,99,235,.10); --accent-line:rgba(37,99,235,.22);
  --accent-wash:rgba(37,99,235,.14); /* 选中洗底，对应 selectionHighlightAlpha=.14 */
  --ok:#16A34A; --ok-tint:rgba(22,163,74,.10);
  --danger:#D64545; --danger-tint:rgba(214,69,69,.10);
  --hairline:rgba(26,29,33,.07);
  --glass-dark:rgba(15,20,28,.62);
  --glass-bar:rgba(255,255,255,.60);
  --r-card:16px; --r-cover:12px; --r-inner:8px; --r-pill:999px;
  --shadow-hover:0 8px 24px rgba(0,0,0,.10);
  --shadow-seg:0 2px 8px rgba(0,0,0,.08);
  --shadow-bar:0 -6px 24px rgba(20,28,48,.14);
  --t-select:150ms;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#E4E7EC;color:var(--ink1);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 56px}
.doc-title{width:100%;max-width:1180px;font-size:19px;font-weight:700;color:#232936}
.doc-title small{display:block;font-size:12px;font-weight:400;color:#6b7380;margin-top:4px;line-height:1.6}

/* ── 方案切换：三态并列，可独立预览 ── */
.variants{width:100%;max-width:1180px;display:flex;flex-direction:column;gap:30px}
.vhead{display:flex;align-items:baseline;gap:12px;margin-bottom:-14px}
.vhead b{font-size:14px;color:#232936}
.vhead span{font-size:12px;color:#7a8390}

/* ── 窗壳 ── */
.window{width:100%;max-width:1180px;height:720px;background:var(--page);border-radius:14px;overflow:hidden;
  display:flex;box-shadow:0 20px 56px rgba(20,28,48,.18);position:relative;border:1px solid rgba(255,255,255,.7)}
.window::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(520px 320px at 84% 8%, rgba(143,122,229,.12), transparent 70%),
             radial-gradient(560px 360px at 10% 92%, rgba(240,165,192,.10), transparent 70%)}
.window>*{position:relative;z-index:1}

/* ── 左导航（语境，复用收藏稿） ── */
.rail{width:190px;flex:none;border-right:1px solid var(--hairline);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--glass-bar)}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;font-weight:700;letter-spacing:.1em;font-size:13px}
.brand .logo{width:24px;height:24px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}
.rail-item{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:9px;font-size:12.5px;color:var(--ink2)}
.rail-item.on{background:var(--accent-tint);color:var(--accent);font-weight:600}
.rail-sec{font-size:10.5px;color:var(--ink3);padding:10px 10px 4px}

/* ── 主区 ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.toolglass{flex:none;margin:14px 20px 0;padding:11px 16px;border-radius:var(--r-card);border:1px solid rgba(255,255,255,.7);
  background:var(--glass-bar);display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(30,30,60,.04)}
.toolglass .t{font-size:20px;font-weight:700}
.toolglass .cap{font-size:12px;color:var(--ink3);margin-top:2px}
.toolglass .hint{margin-left:auto;font-size:11.5px;color:var(--ink3)}
.body{flex:1;display:flex;gap:14px;padding:14px 20px 0;overflow:hidden;min-height:0}
.srcpanel{width:196px;flex:none;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card);padding:10px 8px;overflow:auto}
.grp{font-size:10.5px;color:var(--ink3);padding:8px 10px 6px}
.srcrow{display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;border-radius:9px;font-size:12.5px;color:var(--ink1);cursor:pointer}
.srcrow.on{background:var(--accent-tint);color:var(--accent);font-weight:600}
.srcrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcrow .cnt{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

.col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.chiprow{flex:none;display:flex;gap:8px;padding:0 2px 12px;align-items:center}
.chip{font-size:12px;color:var(--ink2);background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:5px 13px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.secthead{flex:none;display:flex;align-items:center;gap:9px;padding:0 2px 12px}
.secthead .h{font-size:14px;font-weight:700}
.secthead .cap{font-size:11px;color:var(--ink3)}
.secthead .spacer{flex:1}

.wall{flex:1;overflow:auto;padding:2px 2px 96px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}
.card{min-width:0;position:relative;cursor:pointer}
.cover{position:relative;aspect-ratio:3/4.05;border-radius:var(--r-cover);overflow:hidden;background:linear-gradient(135deg,#dfe4ec,#cdd4e0)}
.cover .img{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;color:rgba(255,255,255,.65)}
.cover.c1 .img{background:linear-gradient(140deg,#7b8fd6,#b06fb0)}
.cover.c2 .img{background:linear-gradient(140deg,#e08d6f,#d65b7e)}
.cover.c3 .img{background:linear-gradient(140deg,#5aa89a,#3f7fb5)}
.cover.c4 .img{background:linear-gradient(140deg,#c9a24a,#d6763f)}
.cover.c5 .img{background:linear-gradient(140deg,#8f7ae5,#5a6fc9)}
.cover.c6 .img{background:linear-gradient(140deg,#4fb0a5,#2f8f9c)}
.cover.c7 .img{background:linear-gradient(140deg,#e07a9a,#a055b0)}
.cover.c8 .img{background:linear-gradient(140deg,#6f9ad6,#4560a8)}
.badge{position:absolute;left:7px;top:7px;font-size:9px;font-weight:700;color:#fff;background:var(--glass-dark);
  border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:2px 6px}
.tt{font-size:11.5px;line-height:1.35;color:var(--ink1);margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.meta{font-size:10.5px;color:var(--ink3);margin-top:2px}

/* ── 选中洗底 + 勾选框（对应 SelectableCardFrame） ── */
.card .wash{position:absolute;inset:0;border-radius:var(--r-cover);background:var(--accent-wash);
  opacity:0;transition:opacity var(--t-select);pointer-events:none;z-index:2}
.card.selected .wash{opacity:1}
.card .checkbox{position:absolute;right:7px;top:7px;width:20px;height:20px;border-radius:6px;z-index:3;
  border:1.6px solid #fff;background:rgba(15,20,28,.34);display:none;place-items:center;
  box-shadow:0 1px 4px rgba(0,0,0,.2);transition:background var(--t-select),border-color var(--t-select)}
.selecting .card .checkbox{display:grid}
.card.selected .checkbox{background:var(--accent);border-color:var(--accent)}
.checkbox svg{width:13px;height:13px;stroke:#fff;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;
  opacity:0;transition:opacity var(--t-select)}
.card.selected .checkbox svg{opacity:1}

/* ── 多选态底栏（对应 VeneraMultiSelectBar） ── */
.bar{position:absolute;left:20px;right:20px;bottom:16px;z-index:8;border-radius:var(--r-card);
  background:rgba(255,255,255,.86);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
  border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow-bar);
  padding:11px 16px 13px;transform:translateY(140%);opacity:0;pointer-events:none;
  transition:transform var(--t-select) ease,opacity var(--t-select)}
.selecting .bar{transform:translateY(0);opacity:1;pointer-events:auto}
.bar .row1{display:flex;align-items:center;gap:16px}
.bar .count{font-size:13px;font-weight:600;color:var(--ink1);font-variant-numeric:tabular-nums}
.bar .ops{margin-left:auto;display:flex;align-items:center;gap:4px}
.bar .op{font-size:12.5px;color:var(--accent);padding:5px 9px;border-radius:8px;cursor:pointer;user-select:none}
.bar .op:hover{background:var(--accent-tint)}
.bar .op.muted{color:var(--ink3);cursor:default}
.bar .op.muted:hover{background:transparent}
.bar .close{width:24px;height:24px;display:grid;place-items:center;border-radius:7px;cursor:pointer;color:var(--ink2)}
.bar .close:hover{background:rgba(26,29,33,.06)}
.bar .close svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.bar .row2{display:flex;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--hairline)}
.bar .act{font-size:12px;color:var(--ink1);background:var(--card);border:1px solid var(--hairline);
  border-radius:9px;padding:7px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bar .act:hover{box-shadow:var(--shadow-seg);border-color:var(--accent-line)}
.bar .act svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.bar .act.danger{color:var(--danger);background:var(--danger-tint);border-color:transparent;margin-left:auto}
.bar .act.danger:hover{border-color:var(--danger)}

/* ── 长按提示气泡 ── */
.tip{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:9;
  background:var(--glass-dark);color:#fff;font-size:12px;padding:9px 15px;border-radius:10px;
  display:flex;align-items:center;gap:8px;box-shadow:0 8px 28px rgba(0,0,0,.25);pointer-events:none}
.tip svg{width:14px;height:14px;stroke:#fff;stroke-width:1.8;fill:none}

/* ── 标注点 ── */
.mk{position:absolute;z-index:6;width:18px;height:18px;border-radius:50%;background:#8f1fd4;color:#fff;
  font-size:10.5px;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.28)}
</style>
</head>
<body>
<div class="doc-title">
  收藏页 · 多选 / 批量管理态
  <small>在现有收藏页上新增多选交互：长按进入、勾选、全选/反选、批量移出。视觉沿用 favorites-rework-v3，不改原有卡片与配色。三态并列可独立查看；点卡片与按钮有真实反馈。</small>
</div>
<div class="variants">
  <!-- 由脚本注入三态 -->
</div>
<script>
/* ── 演示数据：作品名与站点为占位示例，非真实内容 ── */
const BOOKS = [
  {id:1, cls:'c1', glyph:'碧', title:'雨后的天台', site:'Pixiv', folder:'追更'},
  {id:2, cls:'c2', glyph:'焰', title:'夏祭夜灯', site:'Pixiv', folder:'默认'},
  {id:3, cls:'c3', glyph:'海', title:'深海图书馆', site:'Danbooru', folder:'插画'},
  {id:4, cls:'c4', glyph:'枫', title:'秋日列车', site:'Gelbooru', folder:'默认'},
  {id:5, cls:'c5', glyph:'星', title:'星象观测室', site:'Pixiv', folder:'追更'},
  {id:6, cls:'c6', glyph:'岚', title:'风的形状', site:'Yande', folder:'插画'},
  {id:7, cls:'c7', glyph:'樱', title:'樱花巷', site:'Pixiv', folder:'默认'},
  {id:8, cls:'c8', glyph:'月', title:'月下漫游', site:'Danbooru', folder:'追更'},
];
const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 5"/></svg>';
const ICON_CLOSE = '<svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 16 16"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.6 8h5.8l.6-8"/></svg>';
const ICON_FOLDER = '<svg viewBox="0 0 16 16"><path d="M2 4.5h4l1.2 1.5H14v6H2z"/></svg>';
const ICON_TAP = '<svg viewBox="0 0 16 16"><path d="M6 8V3.2a1 1 0 0 1 2 0V7M8 6.2a1 1 0 0 1 2 0V7M10 6.5a1 1 0 0 1 2 0v3.2c0 2.2-1.6 3.8-3.8 3.8H7.6A2.6 2.6 0 0 1 5 10.9L3.4 8.4a1 1 0 0 1 1.6-1.2L6 8.4"/></svg>';

function cardHtml(b){
  return '<div class="card" data-id="'+b.id+'">'+
    '<div class="cover '+b.cls+'"><div class="img">'+b.glyph+'</div>'+
      '<span class="badge">'+b.site+'</span>'+
      '<span class="checkbox">'+CHECK+'</span>'+
    '</div>'+
    '<div class="wash"></div>'+
    '<div class="tt">'+b.title+'</div>'+
    '<div class="meta">'+b.folder+'</div>'+
  '</div>';
}
function barHtml(){
  return '<div class="bar">'+
    '<div class="row1">'+
      '<span class="count" data-count>已选择 0 项</span>'+
      '<span class="ops">'+
        '<span class="op" data-all>全选</span>'+
        '<span class="op" data-invert>反选</span>'+
        '<span class="close" data-exit title="退出多选">'+ICON_CLOSE+'</span>'+
      '</span>'+
    '</div>'+
    '<div class="row2">'+
      '<span class="act" data-move>'+ICON_FOLDER+'批量移出到夹</span>'+
      '<span class="act" data-download>'+ICON_FOLDER+'批量下载</span>'+
      '<span class="act danger" data-remove>'+ICON_TRASH+'批量移出收藏</span>'+
    '</div>'+
  '</div>';
}
function windowHtml(variant, selecting, preset){
  var tip = variant==='default'
    ? '<div class="tip">'+ICON_TAP+'长按任意封面进入多选</div>' : '';
  var headHint = variant==='default' ? '长按卡片进入多选'
    : variant==='progress' ? '点卡片勾选 · 底栏可批量操作' : '全选已达成 · 可执行批量操作';
  var cards = BOOKS.map(cardHtml).join('');
  return '<section class="vhead"><b>'+variantLabel(variant)+'</b><span>'+variantDesc(variant)+'</span></section>'+
  '<div class="window'+(selecting?' selecting':'')+'" data-variant="'+variant+'" data-win>'+
    '<aside class="rail">'+
      '<div class="brand"><span class="logo">V</span> VENERA</div>'+
      '<div class="rail-item">首页</div><div class="rail-item">发现</div>'+
      '<div class="rail-sec">资源库</div>'+
      '<div class="rail-item on">收藏</div><div class="rail-item">历史</div>'+
      '<div class="rail-item">下载</div>'+
    '</aside>'+
    '<div class="main">'+
      '<div class="toolglass"><div><div class="t">收藏</div><div class="cap">8 项 · 3 个夹</div></div>'+
        '<span class="hint">'+headHint+'</span></div>'+
      '<div class="body">'+
        '<aside class="srcpanel">'+
          '<div class="grp">本地</div>'+
          '<div class="srcrow on"><span class="nm">全部收藏</span><span class="cnt">8</span></div>'+
          '<div class="grp">文件夹</div>'+
          '<div class="srcrow"><span class="nm">追更</span><span class="cnt">3</span></div>'+
          '<div class="srcrow"><span class="nm">默认</span><span class="cnt">3</span></div>'+
          '<div class="srcrow"><span class="nm">插画</span><span class="cnt">2</span></div>'+
        '</aside>'+
        '<div class="col">'+
          '<div class="chiprow"><span class="chip on">全部 8</span><span class="chip">追更 3</span>'+
            '<span class="chip">默认 3</span><span class="chip">插画 2</span></div>'+
          '<div class="secthead"><span class="h">全部收藏</span><span class="cap">按收藏时间</span><span class="spacer"></span></div>'+
          '<div class="wall"><div class="grid">'+cards+'</div>'+tip+'</div>'+
        '</div>'+
      '</div>'+
      barHtml()+
    '</div>'+
  '</div>';
}
function variantLabel(v){return v==='default'?'① 默认态':v==='progress'?'② 多选进行中':'③ 全选态';}
function variantDesc(v){return v==='default'?'进入多选前，提示长按入口'
  :v==='progress'?'已选若干，底栏浮现，可全选/反选/批量'
  :'全选达成，「全选」置灰不可再点';}

document.querySelector('.variants').innerHTML =
  windowHtml('default', false)+
  windowHtml('progress', true)+
  windowHtml('full', true);

/* 预设：进行中态选 3 项，全选态选全部 */
document.querySelectorAll('[data-variant="progress"] .card').forEach(function(c,i){if(i<3)c.classList.add('selected');});
document.querySelectorAll('[data-variant="full"] .card').forEach(function(c){c.classList.add('selected');});

/* ── 交互：每张卡独立维护选中态，底栏随之刷新 ── */
var toastTimer = null;
function flash(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99;'+
    'background:rgba(15,20,28,.9);color:#fff;font-size:12.5px;padding:9px 18px;border-radius:10px;'+
    'box-shadow:0 8px 28px rgba(0,0,0,.25);pointer-events:none';
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){t.remove();}, 1400);
}
function refresh(win){
  var cards = [].slice.call(win.querySelectorAll('.card'));
  var sel = cards.filter(function(c){return c.classList.contains('selected');});
  win.querySelector('[data-count]').textContent = '已选择 '+sel.length+' 项';
  var allOn = sel.length===cards.length && cards.length>0;
  var all = win.querySelector('[data-all]');
  all.classList.toggle('muted', allOn);
  all.textContent = allOn ? '已全选' : '全选';
  /* 选中归零则自动退出多选（对应 MultiSelectState 不变量） */
  if(sel.length===0) win.classList.remove('selecting');
}
function enterSelect(win, card){
  if(!win.classList.contains('selecting')){
    win.classList.add('selecting');
    var tip = win.querySelector('.tip');
    if(tip) tip.style.display='none';
  }
  if(card) card.classList.add('selected');
  refresh(win);
}
document.addEventListener('click', function(e){
  var card = e.target.closest('.card');
  var win = e.target.closest('[data-win]');
  if(!win) return;

  if(card && !e.target.closest('[data-all],[data-invert],[data-exit]')){
    if(win.classList.contains('selecting')){
      card.classList.toggle('selected');
      refresh(win);
    } else {
      /* 默认态点卡片 = 正常打开详情（演示只给提示，不拦截） */
      flash('打开详情：'+card.querySelector('.tt').textContent);
    }
    return;
  }
  /* 长按进入多选 */
  if(e.type==='click' && e.target.closest('.card')) return;

  if(e.target.closest('[data-all]')){
    if(win.querySelector('[data-all]').classList.contains('muted')) return;
    win.querySelectorAll('.card').forEach(function(c){c.classList.add('selected');});
    refresh(win);
  } else if(e.target.closest('[data-invert]')){
    win.querySelectorAll('.card').forEach(function(c){c.classList.toggle('selected');});
    refresh(win);
  } else if(e.target.closest('[data-exit]')){
    win.querySelectorAll('.card').forEach(function(c){c.classList.remove('selected');});
    win.classList.remove('selecting');
    var tip = win.querySelector('.tip'); if(tip) tip.style.display='';
    refresh(win);
  } else if(e.target.closest('[data-move]')){
    flash('批量移出到夹：'+win.querySelector('[data-count]').textContent);
  } else if(e.target.closest('[data-download]')){
    flash('批量下载：'+win.querySelector('[data-count]').textContent);
  } else if(e.target.closest('[data-remove]')){
    flash('批量移出收藏：'+win.querySelector('[data-count]').textContent);
  }
});
/* 长按（>450ms）进入多选并选中该项 */
var pressTimer = null;
document.addEventListener('pointerdown', function(e){
  var card = e.target.closest('.card'); if(!card) return;
  var win = e.target.closest('[data-win]');
  pressTimer = setTimeout(function(){ enterSelect(win, card); flash('已进入多选'); }, 450);
});
['pointerup','pointercancel','pointerleave'].forEach(function(ev){
  document.addEventListener(ev, function(){ clearTimeout(pressTimer); });
});
/* 初始化计数 */
document.querySelectorAll('[data-win]').forEach(refresh);

</script>
</body>
</html>
