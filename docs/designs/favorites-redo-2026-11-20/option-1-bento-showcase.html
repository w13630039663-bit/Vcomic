<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venera 收藏页方案一 · 沉浸式画册展台 + Bento 岛屿风</title>
<style>
  :root {
    --bg-canvas: #0b0c10;
    --bg-island: rgba(24, 26, 32, 0.72);
    --bg-island-solid: #181a20;
    --bg-elevated: rgba(36, 39, 48, 0.78);
    --bg-pill: rgba(255, 255, 255, 0.06);
    --bg-pill-hover: rgba(255, 255, 255, 0.11);
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.14);
    --img-outline: rgba(255, 255, 255, 0.10);
    --text-primary: #f4f5f7;
    --text-secondary: #9ca3af;
    --text-muted: #6b7280;
    --accent: #0A84FF;
    --accent-soft: rgba(10, 132, 255, 0.16);
    --accent-glow: rgba(10, 132, 255, 0.35);
    --danger: #ff453a;
    --success: #30d158;
    --shadow-island: 0 12px 32px rgba(0, 0, 0, 0.36), 0 1px 0 rgba(255, 255, 255, 0.05) inset;
    --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.32);
    --radius-island: 20px;
    --radius-card: 14px;
    --radius-inner: 10px;
  }

  [data-theme="light"] {
    --bg-canvas: #f2f4f8;
    --bg-island: rgba(255, 255, 255, 0.82);
    --bg-island-solid: #ffffff;
    --bg-elevated: rgba(243, 245, 249, 0.9);
    --bg-pill: rgba(0, 0, 0, 0.045);
    --bg-pill-hover: rgba(0, 0, 0, 0.08);
    --border-subtle: rgba(0, 0, 0, 0.07);
    --border-strong: rgba(0, 0, 0, 0.12);
    --img-outline: rgba(0, 0, 0, 0.10);
    --text-primary: #111827;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    --accent: #0A63F6;
    --accent-soft: rgba(10, 99, 246, 0.12);
    --accent-glow: rgba(10, 99, 246, 0.22);
    --shadow-island: 0 10px 28px rgba(15, 23, 42, 0.06), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
    --shadow-card: 0 6px 16px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-canvas);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 16px;
    transition: background 0.25s ease, color 0.25s ease;
    overflow-x: hidden;
  }

  /* 顶部演示控制条 */
  .demo-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    margin-bottom: 14px;
    border-radius: 14px;
    background: var(--bg-island);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(16px);
    font-size: 13px;
  }
  .demo-bar .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .demo-bar .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .demo-actions { display: flex; gap: 8px; }
  .btn-ghost {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-pill);
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-ghost:hover { background: var(--bg-pill-hover); }

  /* 主容器：Bento 双栏 */
  .app-shell {
    display: grid;
    grid-template-columns: 248px 1fr;
    gap: 16px;
    max-width: 1440px;
    margin: 0 auto;
    min-height: calc(100vh - 86px);
  }

  /* 左侧源岛屿 */
  .sidebar-island {
    background: var(--bg-island);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-island);
    padding: 16px 12px;
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow-island);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sidebar-header {
    padding: 4px 8px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .sidebar-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .sidebar-header span { font-size: 12px; color: var(--text-secondary); }

  .nav-group-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 10px 6px;
    letter-spacing: 0.04em;
  }
  .nav-list { display: flex; flex-direction: column; gap: 4px; }
  .nav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 10px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .nav-item:hover { background: var(--bg-pill); color: var(--text-primary); }
  .nav-item.active {
    background: var(--accent);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .nav-left { display: flex; align-items: center; gap: 10px; }
  .nav-icon {
    width: 24px; height: 24px; border-radius: 7px;
    display: grid; place-items: center;
    font-size: 12px; font-weight: 700;
    background: var(--bg-pill-hover);
    color: var(--text-primary);
  }
  .nav-item.active .nav-icon { background: rgba(255,255,255,0.22); color: #fff; }
  .nav-count { font-size: 12px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .status-dot.offline { background: var(--text-muted); opacity: 0.5; }

  .sidebar-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border-subtle);
  }
  .manage-btn {
    width: 100%;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .manage-btn:hover { background: var(--bg-pill); color: var(--text-primary); }

  /* 右侧主区 */
  .main-column {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 0;
  }

  /* 顶部 Bento Hero 展台（仅本地收藏显示） */
  .hero-bento {
    display: grid;
    grid-template-columns: 1.45fr 1fr;
    gap: 16px;
  }
  .hero-spotlight {
    position: relative;
    border-radius: var(--radius-island);
    padding: 20px;
    overflow: hidden;
    border: 1px solid var(--border-subtle);
    background: var(--bg-island);
    box-shadow: var(--shadow-island);
    display: flex;
    gap: 20px;
    align-items: center;
  }
  /* 封面取色光晕背景 */
  .hero-glow {
    position: absolute;
    inset: -40px;
    background: radial-gradient(circle at 20% 30%, rgba(255, 184, 77, 0.28), transparent 55%),
                radial-gradient(circle at 80% 70%, rgba(10, 132, 255, 0.22), transparent 60%);
    filter: blur(32px);
    z-index: 0;
    pointer-events: none;
  }
  .hero-cover {
    position: relative;
    z-index: 1;
    width: 104px;
    aspect-ratio: 3 / 4;
    border-radius: 12px;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 12px 24px rgba(0,0,0,0.4);
    outline: 1px solid var(--img-outline);
    outline-offset: -1px;
  }
  .hero-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-info {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }
  .hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .hero-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-meta { font-size: 12px; color: var(--text-secondary); }
  .hero-cta-row { display: flex; gap: 8px; margin-top: 6px; }
  .btn-primary {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  .btn-secondary {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--bg-pill);
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
  }

  /* 右侧最近收藏小岛 */
  .recent-island {
    border-radius: var(--radius-island);
    padding: 16px 18px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-island);
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow-island);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .recent-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .recent-head span { font-size: 13px; font-weight: 600; }
  .recent-head small { font-size: 12px; color: var(--text-secondary); }
  .recent-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .recent-thumb {
    aspect-ratio: 3 / 4;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    outline: 1px solid var(--img-outline);
    outline-offset: -1px;
    transition: transform 0.18s ease;
  }
  .recent-thumb:hover { transform: translateY(-3px); }
  .recent-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 主画廊岛屿 */
  .gallery-island {
    flex: 1;
    border-radius: var(--radius-island);
    padding: 18px 20px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-island);
    backdrop-filter: blur(24px);
    box-shadow: var(--shadow-island);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 工具栏：文件夹胶囊 + 排序 + 新建 */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .folder-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg-pill);
    color: var(--text-secondary);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pill:hover { background: var(--bg-pill-hover); color: var(--text-primary); }
  .pill.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(10, 132, 255, 0.35);
    font-weight: 600;
  }
  .pill .cnt { font-size: 11px; opacity: 0.75; font-variant-numeric: tabular-nums; }

  .toolbar-right { display: flex; gap: 8px; align-items: center; }

  /* 漫画网格 */
  .comic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(164px, 1fr));
    gap: 16px;
  }
  .comic-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-card);
    padding: 8px; /* Outer 14 = Inner 6 + Padding 8? 调整为 Inner 8 + Padding 6 -> Outer 14 */
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    position: relative;
  }
  .comic-card:hover {
    border-color: var(--border-strong);
    box-shadow: var(--shadow-card);
  }
  .cover-wrap {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 8px; /* 同心圆：14 - 6 = 8 */
    overflow: hidden;
    outline: 1px solid var(--img-outline);
    outline-offset: -1px;
  }
  .cover-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 悬停浮层：平时隐藏，悬停才出现，保持封面干净 */
  .card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, transparent 45%, rgba(0,0,0,0.45) 100%);
    opacity: 0;
    transition: opacity 0.16s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 8px;
  }
  .comic-card:hover .card-overlay { opacity: 1; }
  .overlay-top { display: flex; justify-content: space-between; align-items: center; }
  .check-circle {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.8);
    background: rgba(0,0,0,0.35);
    display: grid; place-items: center;
    color: #fff; font-size: 12px;
  }
  .remove-chip {
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 11px;
    border: 1px solid rgba(255,255,255,0.18);
  }
  .remove-chip:hover { background: var(--danger); border-color: var(--danger); }

  .source-badge {
    position: absolute;
    left: 8px; bottom: 8px;
    padding: 2px 7px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.62);
    backdrop-filter: blur(8px);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
  }
  .update-dot {
    position: absolute;
    right: 8px; top: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .card-meta { padding: 0 4px 4px; display: flex; flex-direction: column; gap: 3px; }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 11px;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="demo-bar">
  <div class="badge">
    <span class="dot"></span>
    <span>方案一：沉浸式画册展台 + Bento 岛屿风（HTML 视觉稿）</span>
  </div>
  <div class="demo-actions">
    <button class="btn-ghost" onclick="toggleTheme()">切换深/浅主题</button>
    <button class="btn-ghost" onclick="switchView('local')">预览：本地收藏</button>
    <button class="btn-ghost" onclick="switchView('network')">预览：网络源 (Picacg)</button>
  </div>
</div>

<div class="app-shell">
  <!-- 左侧源岛屿 -->
  <aside class="sidebar-island">
    <div class="sidebar-header">
      <h1>收藏</h1>
      <span>共 12 本</span>
    </div>

    <div>
      <div class="nav-group-title">本地与内置</div>
      <div class="nav-list">
        <div class="nav-item active" id="nav-local" onclick="switchView('local')">
          <div class="nav-left">
            <span class="nav-icon">本</span>
            <span>本地收藏</span>
          </div>
          <span class="nav-count">12</span>
        </div>
        <div class="nav-item">
          <div class="nav-left">
            <span class="nav-icon">画</span>
            <span>画廊收藏</span>
          </div>
          <span class="nav-count">8</span>
        </div>
      </div>
    </div>

    <div>
      <div class="nav-group-title">已登录源 · 4</div>
      <div class="nav-list">
        <div class="nav-item" id="nav-picacg" onclick="switchView('network')">
          <div class="nav-left">
            <span class="nav-icon">P</span>
            <span>Picacg</span>
          </div>
          <span class="status-dot"></span>
        </div>
        <div class="nav-item">
          <div class="nav-left">
            <span class="nav-icon">e</span>
            <span>ehentai</span>
          </div>
          <span class="status-dot"></span>
        </div>
        <div class="nav-item">
          <div class="nav-left">
            <span class="nav-icon">禁</span>
            <span>禁漫天堂</span>
          </div>
          <span class="status-dot"></span>
        </div>
        <div class="nav-item">
          <div class="nav-left">
            <span class="nav-icon">n</span>
            <span>nhentai</span>
          </div>
          <span class="status-dot"></span>
        </div>
      </div>
    </div>

    <div>
      <div class="nav-group-title">未登录 · 2</div>
      <div class="nav-list">
        <div class="nav-item">
          <div class="nav-left">
            <span class="nav-icon">包</span>
            <span>包子漫画</span>
          </div>
          <span class="status-dot offline"></span>
        </div>
        <div class="nav-item">
          <div class="nav-left">
            <span class="nav-icon">拷</span>
            <span>拷贝漫画</span>
          </div>
          <span class="status-dot offline"></span>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="manage-btn">
        <span>管理漫画源</span>
        <span>→</span>
      </button>
    </div>
  </aside>

  <!-- 右侧主区 -->
  <main class="main-column">
    <!-- 顶部 Bento Hero 展台（仅本地显示） -->
    <section class="hero-bento" id="hero-section">
      <div class="hero-spotlight">
        <div class="hero-glow"></div>
        <div class="hero-cover">
          <img src="https://picsum.photos/seed/venera1/300/400" alt="封面">
        </div>
        <div class="hero-info">
          <span class="hero-eyebrow">● 最近收藏 · 继续阅读</span>
          <div class="hero-title">イブキね、先生がだ〜いすき！</div>
          <div class="hero-meta">来源：Picacg · 文件夹：默认 · 2 小时前收藏</div>
          <div class="hero-cta-row">
            <button class="btn-primary">立即阅读</button>
            <button class="btn-secondary">查看详情</button>
          </div>
        </div>
      </div>

      <div class="recent-island">
        <div class="recent-head">
          <span>最近入库</span>
          <small>共 12 本</small>
        </div>
        <div class="recent-strip">
          <div class="recent-thumb"><img src="https://picsum.photos/seed/venera1/200/266" alt=""></div>
          <div class="recent-thumb"><img src="https://picsum.photos/seed/venera2/200/266" alt=""></div>
          <div class="recent-thumb"><img src="https://picsum.photos/seed/venera3/200/266" alt=""></div>
          <div class="recent-thumb"><img src="https://picsum.photos/seed/venera4/200/266" alt=""></div>
        </div>
      </div>
    </section>

    <!-- 主画廊岛屿 -->
    <section class="gallery-island">
      <!-- 本地工具栏 -->
      <div class="toolbar" id="local-toolbar">
        <div class="folder-pills">
          <button class="pill active">全部 <span class="cnt">12</span></button>
          <button class="pill">111 <span class="cnt">1</span></button>
          <button class="pill">11 <span class="cnt">0</span></button>
          <button class="pill">默认 <span class="cnt">11</span></button>
        </div>
        <div class="toolbar-right">
          <button class="btn-ghost">排序：收藏时间 ▾</button>
          <button class="btn-ghost">+ 新建文件夹</button>
        </div>
      </div>

      <!-- 网络源工具栏 -->
      <div class="toolbar hidden" id="network-toolbar">
        <div style="display:flex; align-items:center; gap:10px;">
          <h2 style="font-size:18px; font-weight:700;">Picacg</h2>
          <span style="font-size:12px; color:var(--success);">● 已同步</span>
        </div>
        <div class="toolbar-right">
          <button class="btn-ghost">↻ 刷新同步</button>
        </div>
      </div>

      <!-- 漫画网格 -->
      <div class="comic-grid" id="comic-grid"></div>
    </section>
  </main>
</div>

<script>
  const comics = [
    { title: "イブキね、先生がだ〜いすき", src: "picacg", folder: "默认", seed: "venera1", upd: true },
    { title: "旧地狱总集篇", src: "copy_manga", folder: "111", seed: "venera2", upd: false },
    { title: "使用人の外出", src: "picacg", folder: "默认", seed: "venera3", upd: false },
    { title: "东方小妖愁记", src: "picacg", folder: "默认", seed: "venera4", upd: true },
    { title: "枕营业アイドルの...", src: "picacg", folder: "默认", seed: "venera5", upd: false },
    { title: "(C84) [HMA (Hiyoshi H...", src: "ehentai", folder: "默认", seed: "venera6", upd: false },
