<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venera 收藏页方案二 · 实体书架 / 唱片陈列架风</title>
<style>
  :root {
    --bg-room: #121110;
    --bg-panel: #1a1816;
    --bg-shelf-back: #161412;
    --shelf-ledge: linear-gradient(180deg, #2c2723 0%, #1d1a17 65%, #0e0c0b 100%);
    --shelf-highlight: rgba(255, 235, 210, 0.08);
    --border-subtle: rgba(255, 245, 230, 0.08);
    --img-outline: rgba(255, 255, 255, 0.10);
    --text-primary: #f5f2ed;
    --text-secondary: #a8a096;
    --text-muted: #6e675f;
    --accent: #0A84FF;
    --accent-soft: rgba(10, 132, 255, 0.16);
    --danger: #ff453a;
    --success: #30d158;
    --book-shadow: 0 14px 24px -6px rgba(0, 0, 0, 0.75), 4px 0 10px rgba(0, 0, 0, 0.45);
  }

  [data-theme="light"] {
    --bg-room: #efeae2;
    --bg-panel: #f8f5f0;
    --bg-shelf-back: #e7e0d5;
    --shelf-ledge: linear-gradient(180deg, #dfd6c7 0%, #cbbda8 70%, #b5a48b 100%);
    --shelf-highlight: rgba(255, 255, 255, 0.65);
    --border-subtle: rgba(60, 45, 30, 0.10);
    --img-outline: rgba(0, 0, 0, 0.10);
    --text-primary: #231f1a;
    --text-secondary: #665e54;
    --text-muted: #998f82;
    --accent: #0A63F6;
    --accent-soft: rgba(10, 99, 246, 0.12);
    --book-shadow: 0 12px 20px -6px rgba(45, 35, 20, 0.28), 3px 0 8px rgba(45, 35, 20, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-room);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 16px;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .demo-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    margin-bottom: 14px;
    border-radius: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    font-size: 13px;
  }
  .demo-bar .badge { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .demo-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .demo-actions { display: flex; gap: 8px; }
  .btn-ghost {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: transparent;
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
  }
  .btn-ghost:hover { background: rgba(128,128,128,0.12); }

  .library-shell {
    display: grid;
    grid-template-columns: 236px 1fr;
    gap: 18px;
    max-width: 1440px;
    margin: 0 auto;
    min-height: calc(100vh - 86px);
  }

  /* 左侧索引柜 */
  .index-cabinet {
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .cabinet-title {
    padding: 0 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .cabinet-title h1 { font-size: 20px; font-weight: 700; }
  .cabinet-title span { font-size: 12px; color: var(--text-secondary); }

  .drawer-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 10px 6px;
    letter-spacing: 0.05em;
  }
  .drawer-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-secondary);
    cursor: pointer;
    margin-bottom: 2px;
    border-left: 3px solid transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .drawer-item:hover { background: rgba(128,128,128,0.08); color: var(--text-primary); }
  .drawer-item.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .status-dot.offline { background: var(--text-muted); opacity: 0.45; }

  .cabinet-footer {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border-subtle);
  }

  /* 右侧书架区 */
  .shelf-room {
    background: var(--bg-panel);
    border: 1px solid var(--border-subtle);
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* 实体文件夹标签页（像档案袋/书签） */
  .folder-tabs-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border-subtle);
    padding-bottom: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tabs-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .folder-tab {
    padding: 7px 14px;
    border-radius: 8px 8px 2px 2px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    background: rgba(128,128,128,0.08);
    border: 1px solid var(--border-subtle);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .folder-tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* 书架层板单元 */
  .shelf-section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
  }

  .shelf-row {
    position: relative;
    padding: 12px 16px 0;
    background: var(--bg-shelf-back);
    border-radius: 12px 12px 4px 4px;
    border: 1px solid var(--border-subtle);
    margin-bottom: 22px;
  }
  .books-on-shelf {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
    align-items: end;
    padding-bottom: 14px;
  }
  /* 实体层板 */
  .shelf-ledge {
    height: 14px;
    margin: 0 -16px;
    background: var(--shelf-ledge);
    border-top: 1px solid var(--shelf-highlight);
    border-radius: 0 0 6px 6px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.28);
  }

  /* 实体书本/唱片封套 */
  .book-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
    position: relative;
  }
  .book-cover {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 4px 8px 8px 4px; /* 左侧书脊微圆，右侧翻页圆角 */
    overflow: hidden;
    box-shadow: var(--book-shadow);
    outline: 1px solid var(--img-outline);
    outline-offset: -1px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  /* 书脊压痕高光 */
  .book-cover::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background: linear-gradient(90deg, rgba(255,255,255,0.22) 0%, rgba(0,0,0,0.25) 60%, transparent 100%);
    z-index: 2;
    pointer-events: none;
  }
  .book-item:hover .book-cover {
    transform: translateY(-6px) scale(1.02);
  }
  .book-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .book-hover-actions {
    position: absolute;
    top: 6px; right: 6px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 3;
  }
  .book-item:hover .book-hover-actions { opacity: 1; }
  .mini-btn {
    padding: 3px 7px;
    border-radius: 5px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    cursor: pointer;
  }
  .mini-btn:hover { background: var(--danger); border-color: var(--danger); }

  .book-spine-tag {
    position: absolute;
    left: 10px; bottom: 6px;
    padding: 2px 6px;
    border-radius: 4px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 10px;
    z-index: 2;
  }

  .book-caption {
    padding: 6px 2px 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .book-title {
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .book-folder { font-size: 11px; color: var(--text-muted); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="demo-bar">
  <div class="badge">
    <span class="dot"></span>
    <span>方案二：实体书架 / 唱片陈列架风（HTML 视觉稿）</span>
  </div>
  <div class="demo-actions">
    <button class="btn-ghost" onclick="toggleTheme()">切换深/浅主题</button>
    <button class="btn-ghost" onclick="switchView('local')">预览：本地收藏</button>
    <button class="btn-ghost" onclick="switchView('network')">预览：网络源 (Picacg)</button>
  </div>
</div>

<div class="library-shell">
  <!-- 左侧索引柜 -->
  <aside class="index-cabinet">
    <div class="cabinet-title">
      <h1>藏书阁</h1>
      <span>12 册</span>
    </div>

    <div>
      <div class="drawer-label">本地馆藏</div>
      <div class="drawer-item active" id="nav-local" onclick="switchView('local')">
        <span>本地收藏</span>
        <span>12</span>
      </div>
      <div class="drawer-item">
        <span>画廊收藏</span>
        <span>8</span>
      </div>
    </div>

    <div>
      <div class="drawer-label">已登录源 · 4</div>
      <div class="drawer-item" id="nav-picacg" onclick="switchView('network')">
        <span>Picacg</span>
        <span class="status-dot"></span>
      </div>
      <div class="drawer-item">
        <span>ehentai</span>
        <span class="status-dot"></span>
      </div>
      <div class="drawer-item">
        <span>禁漫天堂</span>
        <span class="status-dot"></span>
      </div>
      <div class="drawer-item">
        <span>nhentai</span>
        <span class="status-dot"></span>
      </div>
    </div>

    <div>
      <div class="drawer-label">未登录 · 2</div>
      <div class="drawer-item">
        <span>包子漫画</span>
        <span class="status-dot offline"></span>
      </div>
      <div class="drawer-item">
        <span>拷贝漫画</span>
        <span class="status-dot offline"></span>
      </div>
    </div>

    <div class="cabinet-footer">
      <button class="btn-ghost" style="width:100%; text-align:left;">管理漫画源 →</button>
    </div>
  </aside>

  <!-- 右侧书架区 -->
  <main class="shelf-room">
    <!-- 本地工具栏 -->
    <div class="folder-tabs-bar" id="local-toolbar">
      <div class="tabs-group">
        <button class="folder-tab active">全部 12</button>
        <button class="folder-tab">111 · 1</button>
        <button class="folder-tab">11 · 0</button>
        <button class="folder-tab">默认 · 11</button>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-ghost">排序：收藏时间 ▾</button>
        <button class="btn-ghost">+ 新建文件夹</button>
      </div>
    </div>

    <!-- 网络工具栏 -->
    <div class="folder-tabs-bar hidden" id="network-toolbar">
      <div style="display:flex; align-items:center; gap:10px;">
        <h2 style="font-size:18px;">Picacg</h2>
        <span style="font-size:12px; color:var(--success);">● 已同步</span>
      </div>
      <button class="btn-ghost">↻ 刷新同步</button>
    </div>

    <!-- 最近收藏陈列架（仅本地） -->
    <div id="recent-shelf-block">
      <div class="shelf-section-title">
        <span>最近上架</span>
        <span>4 册</span>
      </div>
      <div class="shelf-row">
        <div class="books-on-shelf" id="recent-books"></div>
        <div class="shelf-ledge"></div>
      </div>
    </div>

    <!-- 全部藏书架 -->
    <div>
      <div class="shelf-section-title">
        <span id="main-shelf-title">全部藏书 · 按收藏时间</span>
        <span>12 册</span>
      </div>
      <div class="shelf-row">
        <div class="books-on-shelf" id="shelf-row-1"></div>
        <div class="shelf-ledge"></div>
      </div>
      <div class="shelf-row">
        <div class="books-on-shelf" id="shelf-row-2"></div>
        <div class="shelf-ledge"></div>
      </div>
    </div>
  </main>
</div>

<script>
  const comics = [
    { title: "イブキね、先生がだ〜いすき", src: "picacg", folder: "默认", seed: "venera1" },
    { title: "旧地狱总集篇", src: "copy_manga", folder: "111", seed: "venera2" },
    { title: "使用人の外出", src: "picacg", folder: "默认", seed: "venera3" },
    { title: "东方小妖愁记", src: "picacg", folder: "默认", seed: "venera4" },
    { title: "枕营业アイドルの...", src: "picacg", folder: "默认", seed: "venera5" },
    { title: "(C84) [HMA (Hiyoshi H...", src: "ehentai", folder: "默认", seed: "venera6" },
    { title: "姐弟的不可告人关系", src: "jm", folder: "默认", seed: "venera7" },
    { title: "タイツなこいしちゃん", src: "picacg", folder: "默认", seed: "venera8" },
    { title: "反逆アマノジャクと小...", src: "picacg", folder: "默认", seed: "venera9" },
    { title: "蔚蓝档案官方四格漫画", src: "copy_manga", folder: "默认", seed: "venera10" },
    { title: "可以爱你吗/似曾相识的她", src: "jm", folder: "默认", seed: "venera11" },
    { title: "缺德邻居难相处", src: "jm", folder: "默认", seed: "venera12" }
  ];

  function renderBook(c) {
    return `
      <div class="book-item">
        <div class="book-cover">
          <img src="https://picsum.photos/seed/${c.seed}/300/400" alt="${c.title}">
          <span class="book-spine-tag">${c.src}</span>
          <div class="book-hover-actions">
            <button class="mini-btn">✓</button>
            <button class="mini-btn">移出</button>
          </div>
        </div>
        <div class="book-caption">
          <div class="book-title">${c.title}</div>
          <div class="book-folder">夹：${c.folder}</div>
        </div>
      </div>
    `;
  }

  document.getElementById('recent-books').innerHTML = comics.slice(0, 4).map(renderBook).join('');
  document.getElementById('shelf-row-1').innerHTML = comics.slice(0, 6).map(renderBook).join('');
  document.getElementById('shelf-row-2').innerHTML = comics.slice(6, 12).map(renderBook).join('');

  function toggleTheme() {
    const html = document.documentElement;
    html.setAttribute('data-theme', html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  }

  function switchView(mode) {
    const isLocal = mode === 'local';
    document.getElementById('recent-shelf-block').classList.toggle('hidden', !isLocal);
    document.getElementById('local-toolbar').classList.toggle('hidden', !isLocal);
    document.getElementById('network-toolbar').classList.toggle('hidden', isLocal);
    document.getElementById('main-shelf-title').textContent = isLocal ? '全部藏书 · 按收藏时间' : 'Picacg · 远程书架';
    document.getElementById('nav-local').classList.toggle('active', isLocal);
    document.getElementById('nav-picacg').classList.toggle('active', !isLocal);
  }
</script>
</body>
</html>
