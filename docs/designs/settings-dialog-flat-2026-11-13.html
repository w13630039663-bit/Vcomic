<!doctype html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置弹窗扁平化 · 方案稿</title>
<style>
:root{
  --dlg-bg:#2B2B2B;--dlg-divider:#3A3A3A;--dlg-divider-strong:#454545;
  --dlg-hover:rgba(255,255,255,.05);--dlg-pressed:rgba(255,255,255,.09);
  --dlg-selected:rgba(255,255,255,.09);--dlg-focus:#5B9CFF;
  --dlg-text-1:#EAEAEA;--dlg-text-2:#A8A8A8;--dlg-text-3:#7C7C7C;
  --dlg-field:#303030;--dlg-field-border:#454545;--dlg-on-accent:#FFFFFF;
  --ico-purple:#7C5CFF;--ico-green:#22C55E;--ico-blue:#3B82F6;
  --ico-cyan:#06B6D4;--ico-orange:#F97316;--ico-slate:#64748B;
  --switch-on:#3B82F6;--switch-off:#555555;--danger:#F87171;
  --dlg-w:760px;--dlg-h:790px;--dlg-radius:24px;--inner-radius:16px;
  --edge-pad:8px;--topbar-h:56px;--rail-w:200px;--content-pad:24px;
  --row-h:48px;--nav-h:40px;--ico-block:24px;--ico-radius:7px;
  --row-radius:8px;--field-radius:8px;--avatar:40px;--hit-min:44px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --motion-feedback:150ms;--motion-nav:180ms;--motion-dialog:220ms;
  --easing:cubic-bezier(.2,.8,.2,1);
  --page-bg:#141414;--dlg-scrim:rgba(0,0,0,.5);--dlg-shadow-color:rgba(0,0,0,.45);
  --dlg-field-border-hover:#5A5A5A;--dlg-scroll-thumb:#4A4A4A;--dlg-avatar-bg:rgba(59,130,246,.18);
  --dlg-absent-border:rgba(124,124,124,.3);
  --underlay-bg:#1B1B1B;--underlay-block:#303030;--underlay-bar:#2E2E2E;
  --font:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page-bg);font-family:var(--font);color:var(--dlg-text-1);
  -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:auto}
.underlay{position:fixed;inset:0;background:var(--underlay-bg);padding:48px 56px;overflow:hidden}
.underlay-bar{height:44px;border-radius:10px;background:var(--underlay-bar);margin-bottom:28px}
.underlay-grid{height:340px;border-radius:14px;background:repeating-linear-gradient(90deg,var(--underlay-block) 0 168px,transparent 168px 184px),repeating-linear-gradient(0deg,var(--underlay-block) 0 168px,transparent 168px 184px)}
.underlay h1{font-size:34px;color:var(--dlg-text-1);margin:28px 0 6px}
.underlay p{font-size:14px;color:var(--dlg-text-3);margin:0}
.scrim{position:fixed;inset:0;background:var(--dlg-scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px}
.stage-note{font-size:11px;color:var(--dlg-text-3);letter-spacing:.02em}

/* ── C1 弹窗壳 ── */
.dlg{width:var(--dlg-w);height:var(--dlg-h);max-width:min(960px,calc(100vw - 48px));
  max-height:min(860px,calc(100vh - 88px));min-width:min(720px,calc(100vw - 48px));
  min-height:min(480px,calc(100vh - 88px));
  background:var(--dlg-bg);border:1px solid var(--dlg-divider-strong);
  border-radius:var(--dlg-radius);box-shadow:0 24px 64px var(--dlg-shadow-color);
  display:flex;flex-direction:column;overflow:hidden;
  animation:dlg-in var(--motion-dialog) var(--easing) both}
@keyframes dlg-in{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}

/* ── C2 顶栏 ── */
.topbar{height:var(--topbar-h);flex:none;display:flex;align-items:center;
  border-bottom:1px solid var(--dlg-divider);padding:0 var(--sp-4)}
.topbar .slot-left{width:var(--rail-w);flex:none;display:flex}
.topbar .slot-mid{flex:1;display:flex;justify-content:center;min-width:0}
.topbar .slot-right{width:56px;flex:none;display:flex;justify-content:flex-end}
.search{width:172px;height:32px;display:flex;align-items:center;gap:8px;
  padding:0 10px;background:var(--dlg-field);border:1px solid var(--dlg-field-border);
  border-radius:var(--field-radius);transition:border-color var(--motion-feedback) var(--easing)}
.search:hover{border-color:var(--dlg-field-border-hover)}
.search:focus-within{border-color:var(--dlg-focus);box-shadow:0 0 0 1px var(--dlg-focus)}
.search svg{flex:none;opacity:.75}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--dlg-text-1);
  font-family:var(--font);font-size:12px}
.search input::placeholder{color:var(--dlg-text-3)}
.search .clear{display:none;background:none;border:0;color:var(--dlg-text-2);cursor:pointer;
  font-size:14px;line-height:1;padding:0}
.search.has-value .clear{display:block}
.dlg-title{font-size:14px;font-weight:500;color:var(--dlg-text-1);white-space:nowrap}
.close{width:var(--hit-min);height:var(--hit-min);display:flex;align-items:center;justify-content:center;
  background:none;border:0;border-radius:var(--row-radius);color:var(--dlg-text-2);cursor:pointer;
  transition:background var(--motion-feedback) var(--easing)}
.close:hover{background:var(--dlg-hover);color:var(--dlg-text-1)}
.close:focus-visible,.nav-item:focus-visible,.row:focus-visible,.user:focus-visible,.opt:focus-visible{
  outline:2px solid var(--dlg-focus);outline-offset:-2px}

/* ── 主体两栏 ── */
.body{flex:1;min-height:0;display:flex}
.rail{width:var(--rail-w);flex:none;display:flex;flex-direction:column;
  padding:var(--sp-3) var(--sp-3) var(--sp-4);border-right:1px solid var(--dlg-divider)}
.content{flex:1;min-width:0;overflow-y:auto;padding:8px var(--content-pad) var(--sp-6);
  animation:fade-in var(--motion-nav) var(--easing) both}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.content::-webkit-scrollbar,.rail-list::-webkit-scrollbar{width:8px}
.content::-webkit-scrollbar-thumb,.rail-list::-webkit-scrollbar-thumb{background:var(--dlg-scroll-thumb);border-radius:8px}

/* ── C4 用户卡 ── */
.user{height:56px;display:flex;align-items:center;gap:10px;padding:0 8px;
  border-radius:var(--row-radius);cursor:pointer;
  transition:background var(--motion-feedback) var(--easing),transform var(--motion-feedback) var(--easing)}
.user:hover{background:var(--dlg-hover)}
.user:active{background:var(--dlg-pressed);transform:scale(.96)}
.avatar{width:var(--avatar);height:var(--avatar);flex:none;border-radius:50%;
  background:var(--dlg-avatar-bg);color:var(--ico-blue);display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700}
.user .u-txt{min-width:0;display:flex;flex-direction:column}
.user .u-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user .u-sub{font-size:11px;color:var(--dlg-text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── C3a 分区项 ── */
.rail-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  gap:2px;margin-top:var(--sp-3)}
.nav-item{height:var(--nav-h);min-height:var(--nav-h);display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-3);border-radius:var(--row-radius);color:var(--dlg-text-2);cursor:pointer;
  background:none;border:0;width:100%;text-align:left;font-family:var(--font);font-size:14px;
  transition:background var(--motion-feedback) var(--easing),color var(--motion-feedback) var(--easing),
    transform var(--motion-feedback) var(--easing)}
.nav-item:hover{background:var(--dlg-hover);color:var(--dlg-text-1)}
.nav-item:active{background:var(--dlg-pressed);transform:scale(.96)}
.nav-item.on{background:var(--dlg-selected);color:var(--dlg-text-1);font-weight:500}
.ib{width:var(--ico-block);height:var(--ico-block);flex:none;border-radius:var(--ico-radius);
  display:flex;align-items:center;justify-content:center;color:var(--dlg-on-accent)}
.ib svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.nav-item .label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{font-size:12px;color:var(--dlg-text-3)}
.rail-foot{font-size:11px;color:var(--dlg-text-2);text-align:center;line-height:1.5;
  padding-top:var(--sp-3);white-space:pre-line}
.rail-foot a{color:var(--dlg-focus);text-decoration:none}

/* ── C5a 分组 ── */
.group{margin-top:var(--sp-5)}
.group:first-child{margin-top:var(--sp-2)}
.group-label{font-size:12px;font-weight:500;color:var(--dlg-text-2);margin:0 0 var(--sp-2) var(--sp-3)}
.group-label .src{color:var(--dlg-text-3);font-weight:400}

/* ── C6 行 ── */
.rows{display:flex;flex-direction:column}
.row{min-height:var(--row-h);display:flex;align-items:center;gap:var(--sp-3);
  padding:0 var(--sp-3);border-radius:var(--row-radius);position:relative;
  transition:background var(--motion-feedback) var(--easing),transform var(--motion-feedback) var(--easing)}
.row+.row::before{content:"";position:absolute;top:0;left:var(--sp-3);right:var(--sp-3);
  height:1px;background:var(--dlg-divider)}
.row.clickable{cursor:pointer}
.row.clickable:hover{background:var(--dlg-hover)}
.row.clickable:active{background:var(--dlg-pressed);transform:scale(.96)}
.row .r-txt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.row .r-title{font-size:14px;color:var(--dlg-text-1);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row .r-cap{font-size:11px;color:var(--dlg-text-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row .r-right{flex:none;display:flex;align-items:center;gap:var(--sp-2);max-width:52%}
.row .r-val{font-size:12px;color:var(--dlg-text-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:right}
.row .r-act{font-size:12px;color:var(--ico-blue);padding:6px 10px;border-radius:var(--field-radius);
  white-space:nowrap}
.row .r-act.danger{color:var(--danger)}
.row .absent{font-size:11px;color:var(--dlg-text-3);border:1px solid var(--dlg-absent-border);
  border-radius:5px;padding:2px 6px}
.row.disabled .r-title{color:var(--dlg-text-3)}

/* 开关 */
.sw{width:36px;height:20px;flex:none;border-radius:20px;background:var(--switch-off);
  border:0;cursor:pointer;position:relative;padding:0;transition:background var(--motion-feedback) var(--easing)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--dlg-on-accent);transition:transform var(--motion-feedback) var(--easing)}
.sw[aria-checked="true"]{background:var(--switch-on)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.sw:disabled{opacity:.45;cursor:default}

/* 行内输入 */
.inline-input{width:180px;height:30px;background:var(--dlg-field);
  border:1px solid var(--dlg-field-border);border-radius:var(--field-radius);
  color:var(--dlg-text-1);font-family:var(--font);font-size:12px;padding:0 10px;outline:0}
.inline-input:focus{border-color:var(--dlg-focus)}

/* 选项浮层 */
.opt-wrap{position:relative;z-index:10}
.row{isolation:isolate}
.opt-pop{position:absolute;bottom:calc(100% + 4px);right:0;min-width:160px;z-index:20;
  background:var(--dlg-field);border:1px solid var(--dlg-divider-strong);border-radius:var(--row-radius);
  box-shadow:0 12px 32px var(--dlg-shadow-color);padding:4px;display:none}
.opt-pop.open{display:block}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;height:36px;
  padding:0 10px;background:none;border:0;border-radius:6px;color:var(--dlg-text-1);
  font-family:var(--font);font-size:12px;cursor:pointer;text-align:left}
.opt:hover{background:var(--dlg-hover)}
.opt.on{background:var(--dlg-selected)}
.opt .tick{color:var(--dlg-focus)}

.empty{display:flex;align-items:center;justify-content:center;height:100%;min-height:200px;
  font-size:14px;color:var(--dlg-text-2)}

@media (max-width:760px){
  :root{--rail-w:64px;--content-pad:16px}
  .topbar .slot-left{width:64px}
  .search{width:56px}
  .search input,.nav-item .label,.nav-item .chev,.rail-foot,.user .u-txt{display:none}
  .user{justify-content:center;padding:0}
  .nav-item{justify-content:center;padding:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0ms!important;transition-duration:0ms!important}
}
</style>
</head>

let current = SECTIONS[0].key;
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const icon = (k,color)=>`<span class="ib" style="background:var(${color})"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.info}</svg></span>`;

function renderNav(){
  $('#nav').innerHTML = SECTIONS.map(s=>`
    <button class="nav-item${s.key===current?' on':''}" data-key="${s.key}" type="button" aria-current="${s.key===current?'true':'false'}">
      ${icon(s.icon,COLORS[s.key])}<span class="label">${esc(s.title)}</span>
    </button>`).join('');
}

function rowHtml(row,color){
  const clickable = ['options','entry'].includes(row.type);
  const cap = row.c ? `<span class="r-cap">${esc(row.c)}</span>` : '';
  let right = '';
  switch(row.type){
    case 'toggle': right = `<button class="sw" type="button" role="switch" aria-checked="${row.v}" aria-label="${esc(row.t)}"></button>`; break;
    case 'options': right = `<span class="r-val">${esc(row.v)}</span><span class="chev">›</span>`; break;
    case 'entry': right = `<span class="r-val">${esc(row.v||'')}</span><span class="chev">›</span>`; break;
    case 'action': right = `<span class="r-act${row.v==='退出登录'?' danger':''}">${esc(row.v)}</span>`; break;
    case 'text': right = `<input class="inline-input" type="text" value="${esc(row.v)}" aria-label="${esc(row.t)}">`; break;
    case 'absent': right = `<span class="absent">不可用</span>`; break;
    case 'plain': right = `<span class="r-val">${esc(row.v)}</span>`; break;
  }
  return `<div class="row${clickable?' clickable':''}${row.type==='absent'?' disabled':''}"${clickable?' tabindex="0" role="button"':''} data-t="${esc(row.t)}">
    ${icon(row.icon||'info',row.type==='absent'?'--ico-slate':(row.co||color))}
    <div class="r-txt"><span class="r-title">${esc(row.t)}</span>${cap}</div>
    <div class="r-right">${right}</div></div>`;
}

function renderContent(q=''){
  const sec = SECTIONS.find(s=>s.key===current);
  $('#dlgTitle').textContent = q ? '搜索结果' : sec.title;
  const groups = q
    ? SECTIONS.flatMap(s=>s.groups.map(g=>({...g,src:s.title,rows:g.rows.filter(r=>r.t.includes(q)||(r.c||'').includes(q))})).filter(g=>g.rows.length))
    : sec.groups;
  const html = groups.map(g=>`
    <section class="group">
      <h2 class="group-label">${esc(g.title)}${g.src?` <span class="src">· ${esc(g.src)}</span>`:''}</h2>
      <div class="rows">${g.rows.map(r=>rowHtml(r,COLORS[sec.key])).join('')}</div>
    </section>`).join('');
  $('#content').innerHTML = html || `<div class="empty">没有匹配「${esc(q)}」的设置项。</div>`;
  $('#content').style.animation='none'; void $('#content').offsetWidth;
  $('#content').style.animation='';
}

// 分区切换
$('#nav').addEventListener('click',e=>{
  const btn=e.target.closest('.nav-item'); if(!btn)return;
  current=btn.dataset.key; renderNav(); renderContent($('#search').value.trim());
});
// 搜索
$('#search').addEventListener('input',e=>{
  const q=e.target.value.trim();
  $('#searchBox').classList.toggle('has-value',!!q);
  renderContent(q);
});
$('#clear').addEventListener('click',()=>{
  $('#search').value=''; $('#searchBox').classList.remove('has-value');
  renderContent(''); $('#search').focus();
});
// 行交互：开关 / 选项 / 入口（一条委托链，浮层选择优先）
$('#content').addEventListener('click',e=>{
  const opt=e.target.closest('.opt');
  if(opt){const row=opt.closest('.row'); const t=row?.dataset.t;
    const value=opt.textContent.replace('✓','').trim();
    $$('.opt-pop').forEach(p=>p.remove());
    const sec=SECTIONS.find(s=>s.key===current);
    const grp=sec.groups.find(g=>g.rows.some(r=>r.t===t));
    const r=grp&&grp.rows.find(x=>x.t===t);
    if(r){r.v=value;}
    renderContent($('#search').value.trim()); return;}
  const sw=e.target.closest('.sw');
  if(sw){sw.setAttribute('aria-checked',sw.getAttribute('aria-checked')==='true'?'false':'true');return;}
  const row=e.target.closest('.row.clickable'); if(!row)return;
  $$('.opt-pop').forEach(p=>p.remove());
  const sec=SECTIONS.find(s=>s.key===current);
  const grp=sec.groups.find(g=>g.rows.some(r=>r.t===row.dataset.t));
  const r=grp&&grp.rows.find(x=>x.t===row.dataset.t);
  if(r&&r.type==='options'){
    const pop=document.createElement('div'); pop.className='opt-pop open';
    pop.innerHTML=r.opts.map(o=>`<button class="opt${o===r.v?' on':''}" type="button">${esc(o)}${o===r.v?'<span class="tick">✓</span>':''}</button>`).join('');
    const wrap=document.createElement('div'); wrap.className='opt-wrap'; wrap.appendChild(pop);
    $('.r-right',row).appendChild(wrap);
  }
});
$('#content').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('row')){e.preventDefault();e.target.click();}
});
document.addEventListener('click',e=>{if(!e.target.closest('.opt-pop')&&!e.target.closest('.row.clickable'))$$('.opt-pop').forEach(p=>p.remove());});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')$$('.opt-pop').forEach(p=>p.remove());
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();}
});

renderNav(); renderContent('');
</script>
